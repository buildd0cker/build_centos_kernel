name: Build Linux Kernel 6.6.47 with Landlock (CentOS 7 Full Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev bison flex bc libelf-dev dwarves wget

      - name: Download kernel
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.47.tar.xz
          tar -xvf linux-6.6.47.tar.xz

      - name: Copy CentOS 7 full config
        run: |
          cp .config linux-6.6.47/.config

      - name: Enable Landlock on CentOS 7 config
        run: |
          cd linux-6.6.47
          # 启用 Landlock
          scripts/config --enable SECURITY
          scripts/config --enable SECURITY_LANDLOCK
          scripts/config --enable LANDLOCK
          scripts/config --enable SECURITY_LANDLOCK_ABI_4
          # 确保关键依赖为 y（而不是 m）
          scripts/config --enable SYSCTL
          scripts/config --enable PROC_FS
          scripts/config --enable SECURITYFS
          # 保留 LVM 和 VMware 驱动
          scripts/config --enable MD
          scripts/config --enable BLK_DEV_DM
          scripts/config --enable DM_MIRROR
          scripts/config --enable DM_SNAPSHOT
          scripts/config --enable DM_CRYPT
          scripts/config --enable DM_ZERO
          scripts/config --enable SCSI_VMWARE_PVSCSI
          scripts/config --enable VIRTIO
          scripts/config --enable VIRTIO_PCI
          scripts/config --enable VIRTIO_BALLOON
          scripts/config --enable VIRTIO_BLK
          scripts/config --enable VIRTIO_NET
          scripts/config --enable VIRTIO_CONSOLE
          # 处理旧配置的警告
          make olddefconfig

          # 强制写入，防止被覆盖
          echo "CONFIG_LANDLOCK=y" >> .config
          echo "CONFIG_SECURITY_LANDLOCK_ABI_4=y" >> .config
          make olddefconfig

      - name: Verify Landlock config
        run: |
          cd linux-6.6.47
          echo "===== Final Landlock config ====="
          grep -E "LANDLOCK|SECURITY|MD|DM|VMWARE|VIRTIO" .config | grep -v "^#" | sort
          echo "================================"
          if ! grep -q "CONFIG_LANDLOCK=y" .config; then
            echo "ERROR: CONFIG_LANDLOCK is not enabled!"
            exit 1
          fi
          if ! grep -q "CONFIG_SECURITY_LANDLOCK_ABI_4=y" .config; then
            echo "ERROR: CONFIG_SECURITY_LANDLOCK_ABI_4 is not enabled!"
            exit 1
          fi
          echo "All Landlock configs verified OK."

      - name: Build kernel
        run: |
          cd linux-6.6.47
          make -j $(nproc) all

      - name: Install to temp
        run: |
          cd linux-6.6.47
          mkdir -p /tmp/kernel-install/boot
          make modules_install INSTALL_MOD_PATH=/tmp/kernel-install
          cp arch/x86/boot/bzImage /tmp/kernel-install/boot/vmlinuz-6.6.47
          cp System.map /tmp/kernel-install/boot/System.map-6.6.47
          cp .config /tmp/kernel-install/boot/config-6.6.47

      - name: Verify install files
        run: |
          ls -la /tmp/kernel-install/boot/
          grep -E "LANDLOCK" /tmp/kernel-install/boot/config-6.6.47 || echo "WARNING: No LANDLOCK entries!"

      - name: Package
        run: |
          cd /tmp
          tar -czvf kernel-6.6.47-landlock-full.tar.gz kernel-install/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6.6.47-landlock-full
          path: /tmp/kernel-6.6.47-landlock-full.tar.gz